<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Cadastro Seani</title>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <img src="imagens/logo senai.png" alt="Logo Senai" class="brand-mark">
            <span>Senai</span>
        </div>

        <section class="inicio">
            <h1>Cadastros Senai</h1>
        </section>
    </header>

    <main>                              
        <section class="agrupamento">
            <h2>Cadastrar</h2>
            <form id="formCadastro">
                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome Completo" required>
                </div>

                <div class="campo">
                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" required>
                </div>

                <div class="campo">
                    <label for="vinculo">Vínculo com SENAI:</label>
                    <select id="vinculo" required>
                        <option value="">Selecionar</option>
                        <option value="Aluno">Aluno</option>
                        <option value="Professor">Professor</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

            <div class="campo">
                <label for="Turma">Turma ou Setor:</label>
                <input type="text" id="turma"
                    placeholder="Digite sua Turma ou Setor" required>
            </div>
        
                <h3>Endereço</h3>
            <div class="campo">
                <label for="CEP">CEP:</label>
                <input type="text" id="cep"
                    placeholder="Digite seu CEP" maxlength="9" required>

                <p id="mensagemCep"></p>
            </div>

            <div class="campo">
                <label for="logradouro">Logradouro:</label>
                <input type="text" id="logradouro"
                    placeholder="Digite sua Rua ou Avenida" required>
            </div>

            <div class="campo">
                <label for="Numero">Numero:</label>
                <input type="number" id="numero"
                    placeholder="Digite seu Numero" required>
            </div>

            <div class="campo">
                <label for="Complemento">Complemento:</label>
                <input type="text" id="complemento" 
                    placeholder="Digete o complemento">
            </div>

            <div class="campo">
                <label for="Bairro">Bairro:</label>
                <input type="text" id="bairro"
                    placeholder="Digete seu Bairro" required>
            </div>

            <div class="campo">
                <label for="Cidade">Cidade:</label>
                <input type="text" id="cidade"
                    placeholder="Digite sua Cidade" required>
            </div>

            <div class="campo">
                <label for="UF">UF:</label>
                <input type="text" id="uf"
                    placeholder="Digite seu Estado" maxlength="2" required>
            </div>

            <button type="submit" id="btnCadastrar">
                Cadastrar
            </button>
        </form>

        <h2>Cadastros Realizados</h2>
        <div class=" tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome:</th>
                        <th>Nascimento:</th>
                        <th>Vinculo:</th>
                        <th>Turma/Setor:</th>
                        <th>Cep:</th>
                        <th>Logradouro:</th>
                        <th>Complemento:</th>
                        <th>Bairro:</th>
                        <th>Cidade:</th>
                        <th>UF:</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaCadastros"></tbody>
            </table>
        </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
